
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip JalaliToday-Android-Project.zip -d project

      - name: Fix JVM target compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          config = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

          """

          s = s.replace(
              "    defaultConfig {",
              config + "    defaultConfig {",
              1
          )

          p.write_text(s)
          PY
        working-directory: project/JalaliToday


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug
        working-directory: project/JalaliToday

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JalaliToday-debug-apk
          path: project/JalaliToday/app/build/outputs/apk/debug/*.apk
